name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (first release starts at 1.0.7)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: chat-plugin-release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: ./scripts/check-public-files.ps1
      - run: ./scripts/test.ps1
      - run: ./tests/scripts/InstallTests.ps1
      - run: ./tests/scripts/ReleaseVersionTests.ps1
      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUMP: ${{ inputs.bump }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $source = Get-Content ./src/AstralPartyChatPlugin.cs -Raw
          $match = [regex]::Match($source, 'public const string PluginVersion = "([0-9]+\.[0-9]+\.[0-9]+)";')
          if (-not $match.Success) { throw 'Missing initial PluginVersion.' }
          $tags = @(& gh api --paginate "repos/$env:GH_REPO/tags?per_page=100" --jq '.[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read existing release tags.' }
          $params = @{ InitialVersion = $match.Groups[1].Value; Tags = $tags; RunAttempt = [int]$env:RELEASE_ATTEMPT }
          if ($env:RELEASE_EVENT -eq 'workflow_dispatch') { $params.Bump = $env:BUMP }
          else { $params.ExplicitTag = $env:GITHUB_REF_NAME }
          $release = ./scripts/release-version.ps1 @params
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "tag=$($release.Tag)" >> $env:GITHUB_OUTPUT
          Write-Output "Release: ChatPlugin $($release.Tag)"
          "### ChatPlugin $($release.Tag)" >> $env:GITHUB_STEP_SUMMARY
          "Source commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY

  build:
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 15
    environment: release-build
    env:
      RELEASE_VERSION: ${{ needs.checks.outputs.version }}
      RELEASE_TAG: ${{ needs.checks.outputs.tag }}
    outputs:
      artifact-id: ${{ steps.assets.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify release version before using private references
        run: |
          $release = ./scripts/release-version.ps1 -InitialVersion $env:RELEASE_VERSION -ExplicitTag $env:RELEASE_TAG
          if ($release.Version -cne $env:RELEASE_VERSION) { throw 'Release version and tag differ.' }
      - name: Download and verify private build references
        env:
          ASTRAL_REFS_URL: ${{ secrets.ASTRAL_REFS_URL }}
          ASTRAL_REFS_SHA256: ${{ vars.ASTRAL_REFS_SHA256 }}
        run: ./scripts/import-refs.ps1 -ExpectedSha256 $env:ASTRAL_REFS_SHA256
      - name: Build plugin
        run: ./scripts/build.ps1 -RefsRoot (Join-Path $env:GITHUB_WORKSPACE '.work/ci-refs') -Version $env:RELEASE_VERSION
      - name: Verify reference archive and release boundaries
        run: |
          ./tests/scripts/ReferenceArchiveTests.ps1 -RefsRoot (Join-Path $env:GITHUB_WORKSPACE '.work/ci-refs')
          ./tests/scripts/ReleaseAssetsTests.ps1
      - name: Package only public release files
        run: ./scripts/package-release.ps1 -Tag $env:RELEASE_TAG
      - name: Upload release assets to this workflow run
        id: assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/release/AstralParty.Chat.dll
            dist/release/AstralParty.Chat-v*.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  publish:
    needs: [checks, build]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # This job executes no repository code and has no private reference secret.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: release-assets
          digest-mismatch: error
      - name: Verify assets and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.checks.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:RELEASE_TAG
          if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid release tag.' }
          $target = $env:RELEASE_SHA
          if ($target -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid release source commit.' }
          $title = "ChatPlugin $tag"
          $root = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          $zipName = "AstralParty.Chat-$tag.zip"
          $expected = @('AstralParty.Chat.dll', $zipName, 'SHA256SUMS.txt')
          $files = @(Get-ChildItem -LiteralPath $root -Force)
          if ($files.Count -ne 3 -or @($files | Where-Object { $_.PSIsContainer -or $_.Name -cnotin $expected }).Count) {
            throw 'Unexpected release artifact contents.'
          }
          $checksums = @(Get-Content -LiteralPath (Join-Path $root 'SHA256SUMS.txt'))
          if ($checksums.Count -ne 2) { throw 'Invalid checksum manifest.' }
          $seen = @()
          foreach ($line in $checksums) {
            $match = [regex]::Match($line, '^([a-f0-9]{64})  (.+)$')
            if (-not $match.Success) { throw 'Invalid checksum entry.' }
            $name = $match.Groups[2].Value
            if ($name -cnotin @('AstralParty.Chat.dll', $zipName) -or $name -cin $seen) { throw 'Unexpected checksum filename.' }
            $seen += $name
            $hash = (Get-FileHash -LiteralPath (Join-Path $root $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -cne $match.Groups[1].Value) { throw 'Release asset checksum mismatch.' }
          }
          # Validate ZIP members without extracting or executing the artifact.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $root $zipName))
          try {
            $members = @($zip.Entries.FullName)
            $dllMember = 'BepInEx/plugins/AstralPartyChat/AstralParty.Chat.dll'
            if ($members.Count -ne 2 -or @($members | Select-Object -Unique).Count -ne 2 -or @($members | Where-Object { $_ -cnotin @($dllMember, 'INSTALL.txt') }).Count -or $dllMember -cnotin $members -or 'INSTALL.txt' -cnotin $members) {
              throw 'Unexpected install ZIP contents.'
            }
            $stream = $zip.GetEntry($dllMember).Open()
            $sha = [Security.Cryptography.SHA256]::Create()
            try { $zipDllHash = [Convert]::ToHexString($sha.ComputeHash($stream)).ToLowerInvariant() }
            finally { $sha.Dispose(); $stream.Dispose() }
            $dllHash = (Get-FileHash -LiteralPath (Join-Path $root 'AstralParty.Chat.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($zipDllHash -cne $dllHash) { throw 'ZIP and standalone plugin differ.' }
          }
          finally { $zip.Dispose() }
          if ([Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $root 'AstralParty.Chat.dll')).ProductVersion -cne $tag.Substring(1)) {
            throw 'Release tag and built DLL version differ.'
          }
          function Assert-DraftReleaseAssets([object]$Release, [switch]$Complete) {
            if ($Release.isDraft -isnot [bool] -or -not $Release.isDraft) { throw 'Release already published. Create a new version tag.' }
            if ($Release.assets -isnot [Array]) { throw 'Invalid draft Release asset metadata.' }
            $names = @($Release.assets | ForEach-Object { $_.name })
            if ($names.Count -gt 3 -or @($names | Where-Object { $_ -cnotin $expected }).Count -or @($names | Select-Object -Unique).Count -ne $names.Count) {
              throw 'Draft Release contains unexpected assets; remove them before retrying.'
            }
            if ($Complete -and $names.Count -ne 3) { throw 'Draft Release is missing required assets.' }
          }
          $existing = & gh release view $tag --json isDraft,assets 2>$null
          $hasDraft = $LASTEXITCODE -eq 0
          if ($hasDraft) {
            Assert-DraftReleaseAssets ($existing | ConvertFrom-Json)
          }

          # Create tags only after the verified build; never move an existing tag.
          $refJson = & gh api "repos/$env:GH_REPO/git/ref/tags/$tag" 2>$null
          if ($LASTEXITCODE -ne 0) {
            if ($env:RELEASE_EVENT -ne 'workflow_dispatch') { throw 'Pushed release tag is missing.' }
            & gh api --method POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$target" > $null
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create release tag; no existing tag was overwritten.' }
            $refJson = & gh api "repos/$env:GH_REPO/git/ref/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to verify created tag.' }
          }
          $object = ($refJson | ConvertFrom-Json).object
          for ($depth = 0; $object.type -eq 'tag' -and $depth -lt 5; $depth++) {
            if ($object.sha -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid annotated tag object.' }
            $tagJson = & gh api "repos/$env:GH_REPO/git/tags/$($object.sha)"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to resolve annotated tag.' }
            $object = ($tagJson | ConvertFrom-Json).object
          }
          if ($object.type -cne 'commit' -or $object.sha -cne $target) {
            throw 'Release tag points to a different source commit.'
          }
          # Refresh the entire body on draft retries, including rebuilt ZIP checksums.
          $generatedJson = & gh api --method POST "repos/$env:GH_REPO/releases/generate-notes" -f "tag_name=$tag" -f "target_commitish=$target"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to generate release change notes.' }
          $generatedBody = ($generatedJson | ConvertFrom-Json).body
          if ($generatedBody -isnot [string]) { throw 'Invalid generated release notes response.' }
          $dllHash = (Get-FileHash -LiteralPath (Join-Path $root 'AstralParty.Chat.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -LiteralPath (Join-Path $root $zipName) -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @(
            "$title - Astral Party의 BepInEx IL2CPP 채팅 플러그인입니다.",
            '', '## 설치', '',
            "1. $zipName 파일을 내려받아 압축을 풉니다.",
            '2. BepInEx가 설치된 게임 폴더에 압축파일의 내용을 넣습니다.',
            '3. 게임을 실행합니다. 기존 DLL만 교체하려면 AstralParty.Chat.dll을 BepInEx/plugins/AstralPartyChat/에 넣습니다.',
            '', '## 파일 확인', '',
            "- AstralParty.Chat.dll SHA-256: $dllHash",
            "- $zipName SHA-256: $zipHash",
            '- SHA256SUMS.txt에서 두 파일의 체크섬을 확인할 수 있습니다.',
            '', '## 빌드', '',
            "- 소스: https://github.com/$env:GH_REPO/commit/$target",
            "- GitHub Actions: https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID", '',
            $generatedBody
          ) -join "`n"
          $notesPath = Join-Path $env:RUNNER_TEMP 'chat-plugin-release-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          if (-not $hasDraft) {
            & gh release create $tag --verify-tag --target $target --draft --title $title --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft Release.' }
          }
          $assets = @($expected | ForEach-Object { Join-Path $root $_ })
          & gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; Release remains a draft.' }
          $uploaded = & gh release view $tag --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw 'Failed to verify uploaded Release assets; Release remains a draft.' }
          Assert-DraftReleaseAssets ($uploaded | ConvertFrom-Json) -Complete
          & gh release edit $tag --title $title --notes-file $notesPath --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish Release.' }
