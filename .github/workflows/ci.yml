name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Check publication candidates
        run: ./scripts/check-public-files.ps1
      - name: Client and overlay regression checks
        run: ./scripts/test.ps1
      - name: Plugin installation regression checks
        run: ./tests/scripts/InstallTests.ps1
      - name: Release version regression checks
        run: ./tests/scripts/ReleaseVersionTests.ps1
      - name: Local release orchestration regression checks
        run: ./tests/scripts/LocalReleaseTests.ps1

